<header class="hero" {% if section.data.image %}style="background-image: linear-gradient(135deg, {{ manifest.theme.primary }}cc, {{ manifest.theme.secondary }}cc), url('{{ section.data.image }}'); background-size: cover; background-position: center;"{% endif %}>
  <div class="container">
    {% if business.logo %}<img src="{{ business.logo }}" alt="{{ business.name }}" style="height:64px;margin-bottom:20px;border-radius:8px;">{% endif %}
    <h1>{{ section.data.headline }}</h1>
    <p>{{ section.data.description }}</p>
    <a class="btn" href="#{{ manifest.section_order[1] if manifest.section_order | length > 1 else '' }}">{{ section.data.cta }}</a>
  </div>
</header>
