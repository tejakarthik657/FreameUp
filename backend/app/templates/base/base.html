<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ business.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family={{ manifest.theme.font | replace(' ', '+') }}:wght@400;600;700&family={{ manifest.theme.body_font | replace(' ', '+') }}:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{ manifest.theme.primary }};
      --secondary: {{ manifest.theme.secondary }};
      --accent: {{ manifest.theme.accent }};
      --font: '{{ manifest.theme.font }}', serif;
      --body-font: '{{ manifest.theme.body_font }}', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--body-font); color: #1a1a1a; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: var(--font); }
    a { color: inherit; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    .btn {
      display: inline-block; padding: 13px 30px; border-radius: 999px;
      background: var(--primary); color: #fff; text-decoration: none; font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,.15); transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }

    header.hero {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      background-size: cover; background-position: center;
      color: #fff; padding: 140px 24px; text-align: center; min-height: 60vh;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    header.hero h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin-bottom: 18px; line-height: 1.15; text-shadow: 0 2px 20px rgba(0,0,0,.25); }
    header.hero p { font-size: 1.2rem; max-width: 640px; margin: 0 auto 32px; opacity: 0.95; }

    section { padding: 80px 24px; }
    section h2 { font-size: 2rem; margin-bottom: 24px; color: var(--primary); }

    .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card {
      border: 1px solid #eee; border-radius: 14px; padding: 22px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.08); }
    .card h3 { margin-bottom: 8px; }
    .price { color: var(--primary); font-weight: 700; }

    .gallery img, .about-image { width: 100%; border-radius: 14px; object-fit: cover; aspect-ratio: 4/3; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    /* density variant: 5+ photos */
    .gallery.gallery-expanded { display: flex; overflow-x: auto; gap: 16px; grid-template-columns: unset; scroll-snap-type: x mandatory; padding-bottom: 8px; }
    .gallery.gallery-expanded img { width: 240px; flex: 0 0 auto; scroll-snap-align: start; }

    /* owner-image split layouts (about + contact) — this is what stops the site looking flat/generic */
    .about-split, .contact-split {
      display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center;
    }
    @media (max-width: 720px) { .about-split, .contact-split { grid-template-columns: 1fr; } }

    /* density variant: 9+ menu/service items */
    details.menu-dense summary {
      cursor: pointer; font-weight: 600; color: var(--primary); margin-bottom: 16px; list-style: none;
    }
    details.menu-dense summary::-webkit-details-marker { display: none; }

    footer { background: #111; color: #ccc; padding: 40px 24px; text-align: center; font-size: 0.9rem; }
    footer a { color: #fff; text-decoration: none; }
    .devframes-badge {
      position: fixed; bottom: 12px; right: 12px; background: #fff; border-radius: 999px;
      padding: 6px 14px; font-size: 0.75rem; box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <div class="devframes-badge">Made with DevFrames</div>
</body>
</html>
